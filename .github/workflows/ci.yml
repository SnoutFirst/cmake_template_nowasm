name: ci
on:
  pull_request:
  release:
    types: [published]
  push:
    tags:
    branches:
      - main
      - develop

env:
  CLANG_TIDY_VERSION: "19.1.1"
  VERBOSE: 1


jobs:
  Test:
    name: ${{matrix.os}} ${{matrix.compiler}} ${{matrix.build_type}} ${{matrix.packaging_maintainer_mode == 'ON' && '(maintainer mode)' || ''}}
    runs-on: ${{ matrix.os }}
    env:
      # Only used by the "Publish to codecov" step, which is skipped unless a
      # token is configured: without one Codecov rejects the upload and fails
      # an otherwise green build.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false

      # Recommendations:
      #   * support at least 2 operating systems
      #   * support at least 2 compilers
      #   * make sure all supported configurations for your project are built
      #
      # Disable/enable builds in this list to meet the above recommendations
      # and your own projects needs
      matrix:
        os:
          # ubuntu-24.04 and windows-2022 are pinned on purpose: the toolchains
          # below are installed per image, and windows-latest (Server 2025 with
          # Visual Studio 2026) no longer provides the "Visual Studio 17 2022"
          # generator that the msvc jobs configure with. macOS stays on the
          # -latest label, which is the arm64 image.
          - ubuntu-24.04
          - macos-latest
          - windows-2022
        compiler:
          # you can specify the version after `-` like "llvm-15.0.2".
          - llvm-19.1.1
          - gcc-14
        generator:
          - "Ninja Multi-Config"
        build_type:
          - Release
          - Debug
        packaging_maintainer_mode:
          - ON
          - OFF
        build_shared:
          - OFF

        exclude:
          # mingw is determined by this author to be too buggy to support
          - os: windows-2022
            compiler: gcc-14

        include:
          # Add appropriate variables for gcov version required. This will intentionally break
          # if you try to use a compiler that does not have gcov set
          - compiler: gcc-14
            gcov_executable: gcov-14
            enable_ipo: On

          - compiler: llvm-19.1.1
            enable_ipo: Off
            gcov_executable: "llvm-cov gcov"

          - os: macos-latest
            enable_ipo: Off

          # Set up preferred package generators, for given build configurations
          - build_type: Release
            packaging_maintainer_mode: On
            package_generator: TBZ2

          # This exists solely to make sure a non-multiconfig build works
          - os: ubuntu-24.04
            compiler: gcc-14
            generator: "Unix Makefiles"
            build_type: Debug
            gcov_executable: gcov-14
            packaging_maintainer_mode: On
            enable_ipo: Off

          # Windows msvc builds
          - os: windows-2022
            compiler: msvc
            generator: "Visual Studio 17 2022"
            build_type: Debug
            packaging_maintainer_mode: On
            enable_ipo: On

          - os: windows-2022
            compiler: msvc
            generator: "Visual Studio 17 2022"
            build_type: Release
            packaging_maintainer_mode: On
            enable_ipo: On

          - os: windows-2022
            compiler: msvc
            generator: "Visual Studio 17 2022"
            build_type: Debug
            packaging_maintainer_mode: Off

          - os: windows-2022
            compiler: msvc
            generator: "Visual Studio 17 2022"
            build_type: Release
            packaging_maintainer_mode: Off
            package_generator: ZIP

          - os: windows-2022
            compiler: msvc
            generator: "Visual Studio 17 2022"
            build_type: Release
            packaging_maintainer_mode: On
            enable_ipo: On
            build_shared: On


    steps:
      - name: Check for llvm version mismatches
        if: ${{ contains(matrix.compiler, 'llvm') && !contains(matrix.compiler, env.CLANG_TIDY_VERSION) }}
        uses: actions/github-script@v9
        with:
          script: |
            core.setFailed('There is a mismatch between configured llvm compiler and clang-tidy version chosen')

      - uses: actions/checkout@v7

      - name: Setup Cache
        uses: ./.github/actions/setup_cache
        with:
          compiler: ${{ matrix.compiler }}
          build_type: ${{ matrix.build_type }}
          packaging_maintainer_mode: ${{ matrix.packaging_maintainer_mode }}
          generator: ${{ matrix.generator }}

      - name: Project Name
        uses: cardinalby/export-env-action@v2
        with:
          envFile: '.github/constants.env'


      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          vcvarsall: ${{ contains(matrix.os, 'windows' )}}

          cmake: true
          ninja: true
          vcpkg: false
          ccache: true
          clangtidy: ${{ env.CLANG_TIDY_VERSION }}


          cppcheck: true

          gcovr: true
          opencppcoverage: true

      - name: Configure CMake
        run: |
          cmake -S . -B ./build -G "${{matrix.generator}}" -D${{ env.PROJECT_NAME }}_ENABLE_IPO=${{matrix.enable_ipo }} -DCMAKE_BUILD_TYPE:STRING=${{matrix.build_type}} -D${{ env.PROJECT_NAME }}_PACKAGING_MAINTAINER_MODE:BOOL=${{matrix.packaging_maintainer_mode}} -D${{ env.PROJECT_NAME }}_ENABLE_COVERAGE:BOOL=${{ matrix.build_type == 'Debug' }} -DGIT_SHA:STRING=${{ github.sha }}

      - name: Build
        # Execute the build.  You can specify a specific target with "--target <NAME>"
        run: |
          cmake --build ./build --config ${{matrix.build_type}}

      - name: Unix - Test and coverage
        if: runner.os != 'Windows'
        working-directory: ./build
        # Execute tests defined by the CMake configuration.
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: |
          ctest -C ${{matrix.build_type}}
          gcovr -j ${{env.nproc}} --root ../ --print-summary --xml-pretty --xml coverage.xml . --gcov-executable '${{ matrix.gcov_executable }}'

      - name: Windows - Test and coverage
        if: runner.os == 'Windows'
        working-directory: ./build
        run: |
          OpenCppCoverage.exe --export_type cobertura:coverage.xml --cover_children -- ctest -C ${{matrix.build_type}}

      - name: CPack
        if: matrix.package_generator != ''
        working-directory: ./build
        run: |
          cpack -C ${{matrix.build_type}} -G ${{matrix.package_generator}}

      # ---- package (the archives the download page links to) ----
      #
      # They are uploaded as workflow artifacts and attached to the rolling
      # "ci-latest" Release by the pages job: never committed to the repository.
      #
      # The conditions below pick exactly one Release build per platform (there
      # are several per OS in the matrix). They are written out in full because
      # an `include:` entry that does not match a matrix combination would add
      # another job instead of marking an existing one.


      - name: Package (Linux tarball)
        if: >-
          runner.os == 'Linux' && matrix.build_type == 'Release' &&
          matrix.packaging_maintainer_mode == 'ON' && matrix.compiler == 'gcc-14' &&
          matrix.generator == 'Ninja Multi-Config'
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short=7 HEAD)
          tar -czf "cmake_template_nowasm-${sha}-linux-x86_64.tar.gz" \
            -C "build/src/app/${{ matrix.build_type }}" cmake_template_nowasm

      - name: Package (macOS archive)
        if: >-
          runner.os == 'macOS' && matrix.build_type == 'Release' &&
          matrix.packaging_maintainer_mode == 'ON' && matrix.compiler == 'llvm-19.1.1' &&
          matrix.generator == 'Ninja Multi-Config'
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short=7 HEAD)
          ditto -c -k --sequesterRsrc \
            "build/src/app/${{ matrix.build_type }}/cmake_template_nowasm" \
            "cmake_template_nowasm-${sha}-macos-$(uname -m).zip"

      - name: Package (Windows archive)
        if: >-
          runner.os == 'Windows' && matrix.build_type == 'Release' &&
          matrix.packaging_maintainer_mode == 'ON' && matrix.compiler == 'msvc' &&
          matrix.generator == 'Visual Studio 17 2022' && matrix.build_shared == 'OFF'
        shell: pwsh
        run: |
          $out = "build/src/app/${{ matrix.build_type }}"
          $sha = git rev-parse --short=7 HEAD
          # A Release build links the dynamic C runtime, so put the matching
          # redistributable DLLs next to the executable (the windeployqt
          # equivalent for a plain executable).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Sort-Object Name | Select-Object -Last 1
          Copy-Item "$($crt.FullName)\*.dll" $out
          Compress-Archive -Path "$out/*" -DestinationPath "cmake_template_nowasm-$sha-windows-x64.zip"

      - name: Upload packaged binary
        if: >-
          (runner.os == 'Linux' && matrix.build_type == 'Release' &&
          matrix.packaging_maintainer_mode == 'ON' && matrix.compiler == 'gcc-14' &&
          matrix.generator == 'Ninja Multi-Config') ||
          (runner.os == 'macOS' && matrix.build_type == 'Release' &&
          matrix.packaging_maintainer_mode == 'ON' && matrix.compiler == 'llvm-19.1.1' &&
          matrix.generator == 'Ninja Multi-Config') ||
          (runner.os == 'Windows' && matrix.build_type == 'Release' &&
          matrix.packaging_maintainer_mode == 'ON' && matrix.compiler == 'msvc' &&
          matrix.generator == 'Visual Studio 17 2022' && matrix.build_shared == 'OFF')
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ runner.os }}
          path: |
            cmake_template_nowasm-*.tar.gz
            cmake_template_nowasm-*.zip
          if-no-files-found: error

      - name: Publish Tagged Release
        uses: softprops/action-gh-release@v3
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.package_generator != '' }}
        with:
          files: |
            build/*-*${{ matrix.build_type }}*-*.*


      - name: Publish to codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true # we weren't posting previously
          flags: ${{ runner.os }}
          name: ${{ runner.os }}-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/coverage.xml

  # ---- publish ----

  pages:
    name: Publish downloads page and rolling CI release
    needs: Test
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: downloads
          merge-multiple: true

      # The commit sha is dropped from the published names so that
      # releases/download/ci-latest/cmake_template_nowasm-linux-x86_64.tar.gz
      # stays a stable link; the page shows which commit it was built from.
      - name: Give the archives stable names
        run: |
          python3 - <<'STABLE'
          import re
          from pathlib import Path

          for path in sorted(Path("downloads").iterdir()):
              if path.is_file():
                  stable = re.sub(r"-[0-9a-f]{7}(?=-)", "", path.name)
                  if stable != path.name:
                      path.rename(path.with_name(stable))
                      print(f"{path.name} -> {stable}")
          STABLE

      - name: Update the rolling CI release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ci-latest
          name: Latest CI build
          body: |
            Automatically published from the latest successful build of `main`
            (commit ${{ github.sha }}).

            The download page lives at
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          files: downloads/*
          prerelease: true
          make_latest: "false"

      # README.md is the source of truth for the prose on the page: the part
      # between the github-pages markers is rendered to HTML first, then the
      # download table is built around it. The fragment lives outside site/ so
      # that it is not published as a stray file.
      - name: Render the README section of the site
        run: python3 .github/scripts/make_readme_section.py README.md site-parts/readme.html

      - name: Generate the download page
        run: >-
          python3 .github/scripts/make_download_page.py downloads site
          "${{ github.sha }}" "${{ github.ref_name }}" site-parts/readme.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          # Commit on top of the existing gh-pages branch instead of replacing
          # it with a fresh orphan commit: a forced rewrite makes every mirror
          # of this repository report a diverged branch.
          keep_history: true
          user_name: SnoutFirst
          user_email: snoutfirst@protonmail.com

  release-assets:
    name: Attach binaries to the GitHub Release
    needs: Test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: downloads
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: downloads/*
